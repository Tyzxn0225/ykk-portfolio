name: Deploy to GitHub Pages

# 推送到 main 自动构建并发布；也可以在 Actions 页面手动触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 官方要求的权限组合
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送不打断正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 图片资源已在库里（public/assets），构建只是压缩 + 拷贝，
      # 不依赖 scripts/process-images.py 的原始素材目录。
      #
      # 必须用 build:pages：它会设 VITE_BASE=/<仓库名>/。
      # 用普通的 pnpm build 会得到 base '/' 的产物，
      # 在 Pages 的 /<仓库名>/ 子路径下资源全部 404（首页白屏）。
      - name: Build
        run: pnpm build:pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
